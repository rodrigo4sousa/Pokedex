<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Google Sans', Roboto, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Data layer: two repositories map PokeAPI responses and Room rows to domain models</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4043"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="880" height="440" rx="24" fill="#ffffff"/>

  <!-- UI layer -->
  <rect x="24" y="130" width="150" height="180" rx="18" fill="#e8f5dc" stroke="#7ac74c" stroke-width="2"/>
  <text x="99" y="210" font-size="17" font-weight="700" fill="#3d7a1c" text-anchor="middle">UI layer</text>
  <text x="99" y="234" font-size="13" fill="#4f6b3f" text-anchor="middle">ViewModels</text>

  <!-- Data layer band -->
  <rect x="210" y="24" width="646" height="392" rx="20" fill="#e0eafc" stroke="#6390f0" stroke-width="2"/>
  <text x="234" y="58" font-size="20" font-weight="700" fill="#2a5bbf">Data layer</text>

  <!-- Repositories -->
  <g filter="url(#shadow)">
    <rect x="234" y="90" width="230" height="130" rx="18" fill="#ffffff"/>
    <rect x="234" y="250" width="230" height="130" rx="18" fill="#ffffff"/>
  </g>
  <text x="349" y="126" font-size="17" font-weight="700" fill="#202124" text-anchor="middle">PokemonRepository</text>
  <text x="349" y="152" font-size="13" fill="#5f6368" text-anchor="middle">list · detail · evolutions · types</text>
  <text x="349" y="172" font-size="13" fill="#5f6368" text-anchor="middle">caught Pokémon</text>
  <text x="349" y="198" font-size="12" fill="#2a5bbf" text-anchor="middle">returns domain models only</text>
  <text x="349" y="286" font-size="17" font-weight="700" fill="#202124" text-anchor="middle">GuessGameRepository</text>
  <text x="349" y="312" font-size="13" fill="#5f6368" text-anchor="middle">today's round</text>
  <text x="349" y="332" font-size="13" fill="#5f6368" text-anchor="middle">and the streak</text>

  <!-- Data sources -->
  <rect x="642" y="84" width="190" height="80" rx="18" fill="#fde5d3" stroke="#ee8130" stroke-width="2"/>
  <text x="737" y="116" font-size="16" font-weight="700" fill="#8a3d00" text-anchor="middle">PokemonApi</text>
  <text x="737" y="140" font-size="13" fill="#8a3d00" text-anchor="middle">Retrofit → PokeAPI</text>
  <rect x="642" y="200" width="190" height="180" rx="18" fill="#fde0ea" stroke="#f95587" stroke-width="2"/>
  <text x="737" y="232" font-size="16" font-weight="700" fill="#8f1f45" text-anchor="middle">Room</text>
  <text x="737" y="256" font-size="13" fill="#8f1f45" text-anchor="middle">pokedex.db</text>
  <rect x="660" y="272" width="154" height="28" rx="14" fill="#ffffff"/>
  <text x="737" y="291" font-size="12" fill="#8f1f45" text-anchor="middle">CaughtPokemonDao</text>
  <rect x="660" y="312" width="154" height="28" rx="14" fill="#ffffff"/>
  <text x="737" y="331" font-size="12" fill="#8f1f45" text-anchor="middle">GuessGameDao</text>

  <!-- Arrows -->
  <line x1="180" y1="180" x2="228" y2="155" stroke="#3c4043" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="260" x2="228" y2="300" stroke="#3c4043" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="122" x2="636" y2="122" stroke="#3c4043" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M470,192 C560,192 590,286 636,286" fill="none" stroke="#3c4043" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="326" x2="654" y2="326" stroke="#3c4043" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Mappers -->
  <rect x="502" y="106" width="104" height="32" rx="16" fill="#ffffff" stroke="#6390f0"/>
  <text x="554" y="127" font-size="12" fill="#2a5bbf" text-anchor="middle">DTO → domain</text>
  <rect x="502" y="176" width="104" height="32" rx="16" fill="#ffffff" stroke="#6390f0"/>
  <text x="554" y="197" font-size="12" fill="#2a5bbf" text-anchor="middle">entity ↔ domain</text>

</svg>
